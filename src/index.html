<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Piano Jumper</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#05070f;font-family:monospace;color:#cfe0ff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;touch-action:none;user-select:none}
#wrap{width:100%;max-width:1280px;display:flex;flex-direction:column;gap:10px;padding:8px;max-height:100vh}
canvas{width:100%;max-width:calc((100vh - 100px) * 16 / 9);max-width:calc((100dvh - 100px) * 16 / 9);aspect-ratio:16/9;display:block;margin:0 auto;image-rendering:pixelated;border-radius:4px;background:#0a0f1e;box-shadow:0 0 0 2px #1e2b4a,0 0 44px #1b3a7a55,0 8px 32px #000a}
#ctrl{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grp{display:flex;gap:10px}
button{font-family:monospace;font-size:24px;color:#cfe0ff;background:linear-gradient(#1e2a48,#141c30);border:2px solid #3f6fd0;border-radius:14px;box-shadow:0 0 12px #3f6fd055,inset 0 2px 0 #ffffff18,0 4px 0 #0b1120;width:78px;height:68px;touch-action:none;cursor:pointer;transition:transform .05s,box-shadow .05s}
#bj{width:132px;font-size:16px;letter-spacing:2px;border-color:#f2d13c;color:#f2d13c;background:linear-gradient(#2e2a1a,#1e1c12);box-shadow:0 0 14px #f2d13c55,inset 0 2px 0 #ffffff20,0 4px 0 #14120a}
button:active{transform:translateY(3px);box-shadow:0 0 8px #3f6fd077,inset 0 2px 0 #ffffff10,0 1px 0 #0b1120}
#bj:active{transform:translateY(3px);box-shadow:0 0 10px #f2d13c77,inset 0 2px 0 #ffffff10,0 1px 0 #14120a}
@media(min-width:900px) and (hover:hover){#ctrl{display:none}}
</style></head><body>
<div id="wrap">
<canvas id="c" width="1280" height="720"></canvas>
<div id="ctrl">
<div class="grp"><button id="bl">&#9664;</button><button id="br">&#9654;</button></div>
<button id="bj">JUMP</button>
</div>
</div>
<script>
var cv=document.getElementById('c'),g=cv.getContext('2d');
g.imageSmoothingEnabled=false;

/* Geometry. KW / G0 / the launch velocities are TUNED VALUES -- the jump
   reach in keys depends on them, so do not change one without re-measuring.
   TOP-BTOP must stay 18: that gap is the height of a black-key hop. */
var KW=48,NW=15,G0=0.34;
var WMAX=1.6,WACC=0.35,WDEC=0.5;  /* ground movement; tune by feel */
var TOP=252,KH=76,BTOP=234,BKH=20;
var W=640,H=360;
var ACX=320,ACY=248,ACR=150;      /* the rainbow: progress, score and pass
                                     condition in one object (spec 2 / 4-4) */
var NOTE=[0,2,4,5,7,9,11];
var RB=['#ff3b30','#ff9500','#ffdd2d','#34d13f','#2f8fff','#5b4bff','#c04cff'];

function rgba(h,a){
 return 'rgba('+parseInt(h.substr(1,2),16)+','+parseInt(h.substr(3,2),16)
  +','+parseInt(h.substr(5,2),16)+','+a+')';
}

var BLK=[];
for(var i=0;i<NW-1;i++){var m=i%7;
 if(m==0||m==1||m==3||m==4||m==5)BLK.push({x:i*KW+34,w:28,sm:NOTE[m]+1+12*((i/7)|0)});}

/* All public domain. Difficulty rises by the KIND of jump required
   (spec 5), which is why the leap-free tune goes first:
     Ode to Joy      0 leaps            walk + hop only
     London Bridge   one -3 leap        first charged jump
     Twinkle         one +4 leap        a wider one
     When the Saints eight leaps        no rest between them          */
var STAGES=[
 {n:'ODE TO JOY',m:[9,9,10,11,11,10,9,8,7,7,8,9,9,8,8],
  d:'222222222222314',r:'000000000000000'},
 {n:'LONDON BRIDGE',m:[11,12,11,10,9,10,11,8,9,10,9,10,11],
  d:'2222224224226',r:'0000002002000'},
 {n:'TWINKLE TWINKLE LITTLE STAR',m:[7,7,11,11,12,12,11,10,10,9,9,8,8,7],
  d:'22222242222224',r:'00000020000000'},
 {n:'WHEN THE SAINTS GO MARCHING IN',m:[7,9,10,11,7,9,10,11,7,9,10,11,9,7,9,8],
  d:'2226222622244448',r:'0002000200000000'}
];

/* ---------- ambient decor: the sky was empty, that was half the problem ---- */
var STAR=[],FLOAT=[],TWK=[];
for(i=0;i<70;i++)STAR.push({x:Math.random()*W,y:Math.random()*230,
 a:0.1+Math.random()*0.5,ph:Math.random()*200,s:Math.random()<0.2?2:1});
for(i=0;i<13;i++)FLOAT.push({x:Math.random()*W,y:Math.random()*240,
 v:0.1+Math.random()*0.22,c:RB[(Math.random()*7)|0],ph:Math.random()*300,
 k:Math.random()<0.45?2:1});
for(i=0;i<9;i++)TWK.push({x:Math.random()*W,y:20+Math.random()*210,
 ph:Math.random()*200,c:Math.random()<0.5?'#8fc3ff':'#fff3ab'});

/* ---------- NES-flavoured audio ----------------------------------------
   The melody the PLAYER makes is the point, so the backing is bass and
   drums only: no counter-melody to fight it, and the chords stay diatonic
   to C so any white key the player lands on still consonates.          */
var ac=null,NB=null,mute=0;
var CH=[0,7,9,5],ARP=[0,7,12],SPB=0.15;   /* C G Am F, one eighth = 0.15s */
var bstep=0,bnext=0;
function audioMake(){
 if(!ac){var A=window.AudioContext||window.webkitAudioContext;if(A)ac=new A();}
 if(ac&&!NB){
  var n=ac.sampleRate*0.2|0,i;NB=ac.createBuffer(1,n,ac.sampleRate);
  var d=NB.getChannelData(0);
  for(i=0;i<n;i++)d[i]=Math.random()*2-1;
 }
}
function audioInit(){
 audioMake();
 if(ac&&ac.state!='running')ac.resume();
}
function env(q,t,v,a,d){
 q.gain.setValueAtTime(0,t);
 q.gain.linearRampToValueAtTime(v,t+a);
 q.gain.exponentialRampToValueAtTime(1e-4,t+d);
}
function blip(a,b,d,v){
 if(!ac||mute)return;
 var t=ac.currentTime,o=ac.createOscillator(),q=ac.createGain();o.type='square';
 o.frequency.setValueAtTime(a,t);o.frequency.exponentialRampToValueAtTime(b,t+d);
 env(q,t,v,0.004,d);
 o.connect(q);q.connect(ac.destination);o.start(t);o.stop(t+d+0.02);
}
function kick(off){
 if(!ac||mute)return;
 var t=ac.currentTime+off,o=ac.createOscillator(),q=ac.createGain();o.type='triangle';
 o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+0.09);
 env(q,t,0.225,0.005,0.11);
 o.connect(q);q.connect(ac.destination);o.start(t);o.stop(t+0.13);
}
function hat(off){
 if(!ac||mute||!NB)return;
 var t=ac.currentTime+off,s2=ac.createBufferSource(),q=ac.createGain();
 s2.buffer=NB;s2.connect(q);q.connect(ac.destination);
 env(q,t,0.042,0.003,0.045);
 s2.start(t);s2.stop(t+0.06);
}
/* scheduled ahead on the audio clock, so it never drifts with the framerate */
function bgmTick(){
 if(!ac||mute||ac.state!='running')return;
 if(!(S=='title'||(S=='clear'&&ct>150)||(S=='win'&&ct>80))){bnext=0;return;}
 if(!bnext||bnext<ac.currentTime){bnext=ac.currentTime+0.22;bstep=0;}
 var la=ac.currentTime+0.25,st,ph,c,off,gd=0;
 while(bnext<la&&gd++<8){
  st=bstep%32;ph=st%8;c=CH[(st/8|0)%4];off=bnext-ac.currentTime;
  if(off<0)off=0;
  if(ph==0||ph==3||ph==6)tone(smf(c-12),0.14,0.15,'triangle',off);
  if(ph==4)tone(smf(c-5),0.14,0.135,'triangle',off);
  tone(smf(c+ARP[st%3]),0.07,0.033,'square',off);
  if(ph==0||ph==4)kick(off);
  if(ph%2)hat(off);
  bstep++;bnext+=SPB;
 }
}
function tone(f,d,v,tp,off){
 if(!ac||mute)return;
 var t=ac.currentTime+(off||0),o=ac.createOscillator(),gn=ac.createGain();
 o.type=tp||'triangle';o.frequency.value=f;
 env(gn,t,v,0.012,d);
 o.connect(gn);gn.connect(ac.destination);
 o.start(t);o.stop(t+d+0.05);
}
function smf(sm){return 130.813*Math.pow(2,sm/12);}  /* key 7 = middle C */
function fanfare(){
 var q=[24,0,.13, 28,.07,.13, 31,.14,.13, 36,.21,.15,
        31,.31,.10, 36,.38,.10, 40,.45,.6],i;
 for(i=0;i<q.length;i+=3)tone(smf(q[i]),q[i+2],0.15,'triangle',q[i+1]);
}
function wsm(w){return NOTE[w%7]+12*((w/7)|0);}

var TOUCH=("ontouchstart" in window)||navigator.maxTouchPoints>0;
var hHint=1,sHint=1,total=0,litN=0;   /* first hop, first sideways leap */
var S='load',ld=0,ldGo=0,fanFired=0,si=0,mel=[],mi=0,ok=0,bad=0,score=0,combo=0;
var paint=[],sink=[],glow=[],seg=[],miss=0,parts=[],ring=[],trail=[];
var shake=0,passed=false,pop=0,ct=0;
var p={wi:0,x:0,y:TOP,vx:0,vy:0,air:false,face:1,sq:0};
var hl=false,hr=false,charging=false,charge=0,tk=0;
var di=0,dwait=0,demoDone=false,UNIT=12;   /* frames per eighth note */
var rec=[],rseq=[],rpi=0,rpt=0;   /* the performance, and its digest */
var noBlk=-1;   /* the black key you launched from underneath */
var HOLD=80;    /* beat between the last note and the digest */
var UY=6;       /* sit into the key, clear of the black keys behind */
var wph=0;      /* walk cycle, advanced by distance travelled */

/* LISTEN: the tune plays itself, keys sink and colour in, so the player
   hears and sees the target before being asked to perform it. */
function startDemo(n){
 si=n;mel=STAGES[n].m.slice();mi=0;
 paint=[];sink=[];glow=[];
 for(var i=0;i<NW;i++){paint.push(null);sink.push(0);glow.push(0);}
 seg=[];for(i=0;i<mel.length;i++)seg.push(0);
 parts=[];ring=[];trail=[];shake=0;pop=0;charging=false;charge=0;
 p.wi=mel[0]+1;if(p.wi>NW-1)p.wi=mel[0]-1;
 p.x=p.wi*KW+KW/2;p.y=TOP;p.vx=0;p.vy=0;p.air=false;p.face=1;p.sq=0;
 di=0;dwait=26;demoDone=false;S="demo";
}
function skipDemo(){
 while(di<mel.length){var k=mel[di];paint[k]=RB[k%7];glow[k]=0.28;seg[di]=1;di++;}
 mi=di;demoDone=true;
}
function startStage(n){
 si=n;mel=STAGES[n].m.slice();mi=0;ok=0;bad=0;score=0;combo=0;miss=0;
 paint=[];sink=[];glow=[];
 for(var i=0;i<NW;i++){paint.push(null);sink.push(0);glow.push(0);}
 seg=[];for(i=0;i<mel.length;i++)seg.push(0);   /* 0 none 1 clean 2 gappy */
 parts=[];ring=[];trail=[];shake=0;pop=0;charging=false;charge=0;rec=[];
 p.wi=mel[0]+1;if(p.wi>NW-1)p.wi=mel[0]-1;      /* start beside the first note
                                                   so it can be walked to */
 p.x=p.wi*KW+KW/2;p.y=TOP;p.vx=0;p.vy=0;p.air=false;
 p.face=1;p.sq=0;
 S='play';
}

function burst(x,c,n){
 for(var i=0;i<n;i++)parts.push({x:x,y:TOP-4,vx:(Math.random()-0.5)*4,
   vy:-Math.random()*4.2-1.4,c:c,l:38});
}
function enterKey(idx,air){
 sink[idx]=1;
 tone(smf(wsm(idx)),0.9,0.22);
 if(mi<mel.length&&idx==mel[mi]){
  rec.push({t:tk,x:p.x,k:idx,a:air,g:1,m:mi,s:miss?2:1});
  paint[idx]=RB[idx%7];glow[idx]=1;ok++;combo++;
  score+=100+combo*10;
  seg[mi]=miss?2:1;
  ring.push({x:p.x,y:TOP,r:2,c:RB[idx%7],l:30});
  burst(p.x,RB[idx%7],miss?6:14);
  miss=0;pop=1;
  mi++;
  if(mi>=mel.length){passed=(ok/(ok+bad))>=0.8;S='hold';ct=0;}
 }else{rec.push({t:tk,x:p.x,k:idx,a:air,g:0});
  bad++;combo=0;miss++;shake=4;
  ring.push({x:p.x,y:TOP,r:2,c:'#7b8bb5',l:20});}
}
function land(kind,idx){
 p.air=false;p.vy=0;p.vx=0;p.sq=1;trail=[];
 if(kind=='b'){
  tone(smf(BLK[idx].sm),0.5,0.16,'square');
  rec.push({t:tk,x:p.x,k:idx,a:1,b:1});
  bad++;combo=0;miss++;shake=7;
  ring.push({x:p.x,y:BTOP,r:2,c:'#f2645f',l:26});
  return;
 }
 p.y=TOP;                    /* stepping off a black key drops back down */
 enterKey(idx,1);            /* a landing always sounds, boundary or not */
}

/* Replay the run the player just gave, wrong notes and all. Real pauses are
   compressed so a fumbled minute still reads as a few seconds. */
function startReplay(){
 var i,gp,pt=0;rseq=[];
 for(i=0;i<rec.length;i++){
  gp=i?Math.min(rec[i].t-rec[i-1].t,50)*0.55:14;
  if(gp<7)gp=7;
  pt+=gp;rseq.push({t:pt,x:rec[i].x,k:rec[i].k,a:rec[i].a,g:rec[i].g,
   m:rec[i].m,s:rec[i].s,b:rec[i].b});
 }
 for(i=0;i<NW;i++){paint[i]=null;glow[i]=0;sink[i]=0;}
 for(i=0;i<mel.length;i++)seg[i]=0;
 mi=0;rpi=0;rpt=0;parts=[];ring=[];trail=[];
 S=rseq.length?'replay':'clear';ct=0;fanFired=0;litN=0;
}
function fireReplay(e){
 if(e.b){
  tone(smf(BLK[e.k].sm),0.5,0.16,'square');shake=6;
  ring.push({x:e.x,y:BTOP,r:2,c:'#f2645f',l:26});return;
 }
 sink[e.k]=1;tone(smf(wsm(e.k)),0.9,0.22);
 if(e.g){
  paint[e.k]=RB[e.k%7];glow[e.k]=1;seg[e.m]=e.s;mi=e.m+1;pop=1;
  ring.push({x:e.x,y:TOP,r:2,c:RB[e.k%7],l:30});
  burst(e.x,RB[e.k%7],e.s==2?6:14);
 }else ring.push({x:e.x,y:TOP,r:2,c:'#7b8bb5',l:20});
}
/* where the unicorn is at digest-time rpt */
function rpos(){
 var j=0,pv,nx,u,hh,y0,y1,y;
 while(j<rseq.length&&rseq[j].t<=rpt)j++;
 pv=j>0?rseq[j-1]:null;nx=j<rseq.length?rseq[j]:null;
 if(!pv&&!nx)return{x:p.x,y:TOP,f:1};
 if(!pv)return{x:nx.x,y:TOP,f:1};
 if(!nx)return{x:pv.x,y:pv.b?BTOP:TOP,f:1};
 u=(rpt-pv.t)/((nx.t-pv.t)||1);if(u<0)u=0;if(u>1)u=1;
 y0=pv.b?BTOP:TOP;y1=nx.b?BTOP:TOP;y=y0+(y1-y0)*u;
 if(nx.a)y-=Math.sin(u*Math.PI)*(24+Math.abs(nx.x-pv.x)*0.3);
 return{x:pv.x+(nx.x-pv.x)*u,y:y,f:nx.x<pv.x?-1:1};
}
function surfAt(px,py,ny){
 for(var i=0;i<BLK.length;i++){
  var b=BLK[i];
  if(i==noBlk)continue;
  if(px>b.x&&px<b.x+b.w&&py<=BTOP&&ny>=BTOP)return{k:'b',i:i,y:BTOP};
 }
 if(py<=TOP&&ny>=TOP){
  var w=Math.floor(px/KW);if(w<0)w=0;if(w>NW-1)w=NW-1;
  return{k:'w',i:w,y:TOP};
 }
 return null;
}
function predict(dir,pw){
 var sx=p.x,sy=p.y,vx,vy;
 if(dir==0){vx=0;vy=-(4.5+2*pw);}else{vx=dir*(2.0+4.6*pw);vy=-(5.0+2.4*pw);}
 for(var t=0;t<400;t++){
  vy+=G0;var nx=sx+vx,ny=sy+vy;
  if(nx<10)nx=10;if(nx>NW*KW-10)nx=NW*KW-10;
  if(vy>0){var s=surfAt(nx,sy,ny);if(s)return{x:nx,y:s.y,k:s.k};}
  sx=nx;sy=ny;
 }
 return null;
}

function launch(){
 var dir=hl?-1:(hr?1:0),pw=charge;
 audioInit();
 if(dir==0){p.vx=0;p.vy=-(4.5+2*pw);}
 else{p.vx=dir*(2.0+4.6*pw);p.vy=-(5.0+2.4*pw);p.face=dir;}
 blip(300,760,0.1,0.09);
 if(dir)sHint=0;else hHint=0;
 noBlk=-1;
 for(var i=0;i<BLK.length;i++)
  if(p.x>BLK[i].x&&p.x<BLK[i].x+BLK[i].w){noBlk=i;break;}
 p.air=true;
}

function upd(dt){
 var i;
 tk+=dt;
 if(S=='load'&&ldGo){ld+=dt/110;if(ld>=1.25){ld=1;S='title';}}
 if(S=='win'){
  ct+=dt;
  if(ct>20&&!fanFired){fanFired=1;fanfare();}
  if(((tk|0)%2)==0){
   var wq=(Math.random()*NW)|0;
   burst(wq*KW+KW/2,RB[(Math.random()*7)|0],2);
  }
 }
 if(S=='clear'){
  ct+=dt;
  /* the unicorn only flies as far as you earned; the wedges light behind it */
  var acc=(ok+bad)?ok/(ok+bad):0,li=Math.min(1,ct/100)*acc*mel.length,cq;
  for(cq=0;cq<mel.length;cq++)seg[cq]=cq<(li|0)?1:0;   /* never over-report */
  if((li|0)>litN){litN=li|0;tone(smf(19+wsm(litN-1)),0.13,0.12,'square');}
  if(ct>=100&&ct<101&&acc>=0.98)p.sq=1;   /* touchdown, only if it got there */
  if(ct>108&&!fanFired){
   fanFired=1;
   if(passed)fanfare();else blip(320,120,0.4,0.11);
  }
  if(passed&&ct<130&&((tk|0)%3)==0){
   cq=(Math.random()*NW)|0;
   if(paint[cq])burst(cq*KW+KW/2,RB[(Math.random()*7)|0],3);
  }
 }
 if(shake>0)shake-=dt;
 if(pop>0)pop-=0.05*dt;
 for(i=0;i<NW;i++){
  if(sink[i]>0)sink[i]-=0.07*dt;
  if(glow[i]>0.28)glow[i]-=0.02*dt;      /* settles to a steady ambient glow */
 }
 for(i=0;i<FLOAT.length;i++){
  var f=FLOAT[i];f.y-=f.v*dt;f.ph+=dt;
  if(f.y<-18){f.y=250;f.x=Math.random()*W;f.c=RB[(Math.random()*7)|0];}
 }
 for(i=ring.length-1;i>=0;i--){
  var r=ring[i];r.r+=1.5*dt;r.l-=dt;if(r.l<=0)ring.splice(i,1);
 }
 for(i=parts.length-1;i>=0;i--){
  var q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=0.13*dt;q.l-=dt;
  if(q.l<=0)parts.splice(i,1);
 }
 for(i=trail.length-1;i>=0;i--){trail[i].l-=dt;if(trail[i].l<=0)trail.splice(i,1);}
 if(p.sq>0)p.sq-=0.12*dt;
 if(S=='hold'){ct+=dt;if(ct>=HOLD)startReplay();return;}
 if(S=='replay'){
  var rq0=rpos();
  rpt+=dt;
  while(rpi<rseq.length&&rpt>=rseq[rpi].t)fireReplay(rseq[rpi++]);
  if(rq0.y<TOP-5){trail.push({x:rq0.x,y:rq0.y-22,c:RB[(tk/4|0)%7],l:20});
   if(trail.length>26)trail.shift();}
  if(rpi>=rseq.length&&rpt>rseq[rseq.length-1].t+44){
   mi=mel.length;trail=[];
   S='clear';ct=0;fanFired=0;litN=0;
  }
  return;
 }
 if(S=="demo"){
  if(!demoDone){
   dwait-=dt;
   if(dwait<=0){
    if(di<mel.length){
     var dk=mel[di],dl=+STAGES[si].d[di],rs=+STAGES[si].r[di];
     tone(smf(wsm(dk)),dl*UNIT/60*0.92,0.22);
     sink[dk]=1;glow[dk]=1;paint[dk]=RB[dk%7];seg[di]=1;pop=1;
     ring.push({x:dk*KW+KW/2,y:TOP,r:2,c:RB[dk%7],l:26});
     burst(dk*KW+KW/2,RB[dk%7],7);
     di++;mi=di;dwait=(dl+rs)*UNIT;
    }else demoDone=true;
   }
  }
  return;
 }
 if(S!='play')return;
 if(charging){charge+=dt/36;if(charge>1)charge=1;}
 if(!p.air){
  if(charging){
   p.vx=0;                        /* charging plants the feet */
   if(hl)p.face=-1;else if(hr)p.face=1;   /* but you may still turn */
  }else{
   if(hl){p.vx-=WACC*dt;if(p.vx<-WMAX)p.vx=-WMAX;p.face=-1;}
   else if(hr){p.vx+=WACC*dt;if(p.vx>WMAX)p.vx=WMAX;p.face=1;}
   else if(p.vx>0){p.vx-=WDEC*dt;if(p.vx<0)p.vx=0;}
   else if(p.vx<0){p.vx+=WDEC*dt;if(p.vx>0)p.vx=0;}
   if(p.vx){

/* Corners stepped in whole pixels. arcTo draws a true curve, which the
   renderer antialiases into a soft smear -- at this size that reads as blur,
   not as roundness. Pixel art staircases its corners instead. */
function kstep(cx,cy,r,sx,gro,rev){
 /* the two left corners are reached from the far end of the staircase, so
    their points have to come out in reverse or the path folds back on
    itself and the outline self-intersects. */
 var v,e,q=[],p=-1;
 for(v=0;v<=r;v++){
  e=Math.round(Math.sqrt(r*r-(gro?r-v:v)*(gro?r-v:v)));
  if(e!==p){if(p>=0)q.push([cx+sx*p,cy+v]);q.push([cx+sx*e,cy+v]);p=e;}
 }
 q.push([cx+sx*p,cy+r]);
 if(rev)q.reverse();
 for(v=0;v<q.length;v++)g.lineTo(q[v][0],q[v][1]);
}
function kpath(x,y,w,h,rt,rb){

 kstep(x+w-rt,y,rt,1,1,0);
 g.lineTo(x+w,y+h-rb);
 kstep(x+w-rb,y+h-rb,rb,1,0,0);
 g.lineTo(x+rb,y+h);
 kstep(x+rb,y+h-rb,rb,-1,0,1);
 g.lineTo(x,y+rt);

}

/* The rainbow IS the readout: one wedge per note of the song. Filled = played
   first try, hollow = got there but fumbled, dark = not reached.  Spec 3-3:
   "the song always finishes; a bad run leaves the rainbow gap-toothed."

   start rather than as a grey croissant. */
function drawArc(){
 var n=mel.length,i,a0,a1,f,c;

  a0=Math.PI+Math.PI*i/n+0.012;a1=Math.PI+Math.PI*(i+1)/n-0.012;

  g.lineWidth=f==1?25:21;
  g.strokeStyle=f==1?c:f==2?rgba(c,0.3):rgba(c,0.13);
  if(f==1){g.shadowBlur=(i==mi-1&&pop>0)?26:12;g.shadowColor=c;}
  g.beginPath();g.arc(ACX,ACY,ACR,a0,a1);g.stroke();
  g.shadowBlur=0;
  if(f==1){
   g.lineWidth=5;g.strokeStyle='rgba(255,255,255,.45)';
   g.beginPath();g.arc(ACX,ACY,ACR+9,a0,a1);g.stroke();

 }
}

function drawUni(px,py,f,air,ph){
 g.save();g.translate(px,py);
 var sy=1+(p.sq>0?p.sq*0.2:0),sx=1-(p.sq>0?p.sq*0.16:0);
 /* coiling while the jump charges: the clearest read that force is building */
 if(charging&&!air){sy*=0.86;sx*=1.1;}
 var sw=air?0:Math.sin(ph||0);
 var fL=air?4:Math.round(sw*3);        /* front legs */
 var bL=air?-4:Math.round(-sw*3);      /* back legs, opposite phase */
 var ta=air?1:0;                       /* tail streams out in flight */

 g.scale(f*sx*1.55,sy*1.55);
 g.translate(0,air?0:-Math.abs(sw)*1.2);

    the torso from the legs at this size. */

 rect(9,-29-so*3,2,3,Wc);
 rect(9,-29-so*3,1,2,D);

 rect(14,-33-so*4,3,7,'#f2d13c');
 rect(14,-31-so*4,3,1,'#c9a520');
 rect(14,-28-so*4,3,1,'#c9a520');

    reads as being in front. Every hoof bottoms out at y=0 so the feet meet
    the key surface. */
 rect(-8+bL,-10,3,8-so*4,Sh);

 rect(2-fL,-2-so*3,4,2,Hf);

  var hh=hop&&hHint,sl=!hop&&!walk&&sHint;
  if(hh||sl){
   var l1=(TOUCH?'HOLD JUMP':'HOLD SPACE')+(sl?' + < >':''),

   g.fillStyle='rgba(8,13,26,.88)';g.fillRect(bx2,by2,bw2,44);
   rect(bx2,by2,bw2,2,'#f2d13c');rect(bx2,by2+42,bw2,2,'#f2d13c');

   g.lineTo(bx2+bw2/2,by2+54);g.closePath();g.fill();
   txt(l1,bx2+bw2/2,by2+9,2,'#f2d13c',1);
   txt(l2,bx2+bw2/2,by2+25,2,'#cfe0ff',1);
  }
 }

 /* landing preview while charging */
 if(charging&&!p.air){

 g.globalAlpha=1;

 if(S=='clear'||S=='win'){
  var cu=S=='win'?(ct/150)%1:Math.min(1,ct/100)*((ok+bad)?ok/(ok+bad):0),ka,kk,uu;
  for(kk=46;kk>=0;kk--){

  g.globalAlpha=1;
  ka=Math.PI+Math.PI*cu;

 }else if(rq)drawUni(rq.x-cam,rq.y+UY,rq.f,rq.y<TOP-5,rpt*0.5);
 else if(S!='title')
  drawUni(p.x-cam,p.y+UY+(sink[p.wi]>0&&!p.air?sink[p.wi]*5:0),p.face,p.air,wph);
 g.restore();

 if(!vigC)crtLayer();
 if(crtOn)g.drawImage(vigC,0,0,W,H);

 /* HUD: song title only. Progress, score and accuracy all live in the
    rainbow -- spec 4-4 forbids separate readouts. */
 if(S=='play'||S=='demo'||S=='clear'||S=='replay'||S=='hold'){
  /* the glow is what makes it read as a UI panel rather than a box.
     shadowBlur on a stroke is fine; it stays off txt(). */
  g.save();
  rr(8,8,200,30,7);
  g.fillStyle='rgba(8,13,26,.72)';g.fill();
  g.shadowBlur=10;g.shadowColor='#3d7fe0';
  g.strokeStyle='#3d7fe0';g.lineWidth=1.5;g.stroke();
  g.restore();
  txt(STAGES[si].n,16,12,1,'rgba(207,224,255,.85)',0);
  for(i=0;i<STAGES.length;i++)
   rect(16+i*10,26,7,3,i<=si?'#3d7fe0':'#233258');
 }

 if(S=='win'){
  g.fillStyle='rgba(8,13,26,0.55)';g.fillRect(0,0,W,H);
  txtO('ALL SONGS',W/2,96,5,'#fff',1,'#3d7fe0');
  txtO('COMPLETE',W/2,140,5,'#fff',1,RB[((tk/4)|0)%7]);
  if(ct>90){
   txt('TOTAL SCORE '+total,W/2,190,3,'#ffdd2d',1);
  }
  if(ct>150){
   g.globalAlpha=0.6+0.4*Math.sin(tk/16);
   txt('TAP TO PLAY AGAIN',W/2,222,2,'#8fc3ff',1);
   g.globalAlpha=1;
  }
 }
 if(S=='clear'){
  var bt=(ct-108)/24,a3=(ok+bad)?Math.round(ok/(ok+bad)*100):0,bs,bl;
  if(bt>0){
   g.save();
   g.globalAlpha=Math.min(1,bt);
   bs=(4+(1-Math.min(1,bt))*3)|0;
   bl=passed?'STAGE CLEAR':'TRY AGAIN';
   txtO(bl,W/2,130,bs,'#fff',1,passed?'#2f8f4f':'#c03a35');
   g.restore();
  }
  /* a rough run still made music: say so before the score does */
  if(!passed&&a3<=60&&ct>132)
   txt('BUT I LIKE IT!',W/2,164,2,'#fff',1);
  if(ct>150){
   txt('ACCURACY '+a3+'%   NEED 80%   SCORE '+score,W/2,180,2,'#cfe0ff',1);
   g.globalAlpha=0.6+0.4*Math.sin(tk/16);
   txt(!passed?'TAP TO RETRY':si<STAGES.length-1?'TAP FOR THE NEXT SONG':
     'ALL SONGS COMPLETE!',W/2,206,2,passed?'#8fc3ff':'#f2645f',1);
   g.globalAlpha=1;
  }
 }
 if(S=='replay'){
  g.save();
  g.globalAlpha=0.75+0.25*Math.sin(tk/12);
  txtO("YOUR TAKE",W/2,128,3,"#fff",1,"#8e3fc0");
  g.restore();
 }
 if(S=='demo'){
  g.save();
  if(demoDone){
   g.globalAlpha=0.65+0.35*Math.sin(tk/11);
   txtO("START",W/2,124,5,"#fff",1,"#2f8f4f");
   g.restore();
   txtO("TAP OR PRESS SPACE",W/2,172,2,"#fff",1,"#2f8f4f");
  }else{
   g.restore();
   txtO("LISTEN",W/2,124,4,"#fff",1,"#3d7fe0");
   txtO(STAGES[si].n,W/2,166,2,"#fff",1,"#3d7fe0");
  }
 }
 g.save();
 rr(W-36,5,30,24,6);
 g.fillStyle='rgba(8,13,26,.72)';g.fill();
 g.shadowBlur=10;g.shadowColor='#3d7fe0';
 g.strokeStyle='#3d7fe0';g.lineWidth=1.5;g.stroke();
 g.restore();
 g.globalAlpha=0.55;
 rect(W-30,13,4,8,'#cfe0ff');
 g.fillStyle='#cfe0ff';
 g.beginPath();g.moveTo(W-26,17);g.lineTo(W-19,10);g.lineTo(W-19,24);g.closePath();g.fill();
 if(mute){
  g.strokeStyle='#f2645f';g.lineWidth=2;
  g.beginPath();g.moveTo(W-32,9);g.lineTo(W-15,25);g.stroke();
 }else{rect(W-16,15,2,4,'#cfe0ff');rect(W-13,12,2,10,'#cfe0ff');}
 g.globalAlpha=1;
 if(S=='title'){

   for(i=0;i<ttl.length;i++){
    txt(ttl.charAt(i),x0+i*6*sc2+5,yy+5,sc2,'#05080f',0);

 }
 drawCRT();
}

var last=0,accd=0,fr=0;
function loop(t){
 var dt=(t-last)/16.667;last=t;
 if(!dt||dt>4)dt=4;
 accd+=dt;
 for(fr=0;accd>=1&&fr<8;fr++){upd(1);accd-=1;}
 if(fr>=8)accd=0;
 bgmTick();
 drw();
 requestAnimationFrame(loop);
}

function confirm2(){
 audioInit();blip(520,880,0.09,0.11);
 if(S=='load'){ldGo=1;return true;}
 if(S=='title'){total=0;startDemo(0);return true;}
 if(S=='demo'){
  if(demoDone)startStage(si);else skipDemo();
  return true;
 }
 if(S=='clear'){
  if(ct<150)return true;
  if(!passed){startDemo(si);return true;}
  total+=score;
  if(si<STAGES.length-1)startDemo(si+1);
  else{S='win';ct=0;fanFired=0;for(var q=0;q<mel.length;q++)seg[q]=1;}
  return true;
 }
 if(S=='win'){if(ct>150){total=0;startDemo(0);}return true;}
 return false;
}
function jdown(){
 if(confirm2())return;
 if(S!='play'||charging)return;
 if(!p.air){charging=true;charge=0;p.vx=0;blip(200,300,0.05,0.07);}
}
function jup(){
 if(charging){charging=false;if(S=='play'&&!p.air)launch();}
}

addEventListener('keydown',function(e){
 if(e.repeat)return;
 if(S=='load'){confirm2();e.preventDefault();return;}
 var k=e.key;
 if(k=='ArrowLeft'){hl=true;e.preventDefault();}
 else if(k=='ArrowRight'){hr=true;e.preventDefault();}
 else if(k==' '||k=='ArrowUp'){jdown();e.preventDefault();}
 else if(k=='m'||k=='M')mute=mute?0:1;
 else if(k=='c'||k=='C')crtOn=crtOn?0:1;
});
addEventListener('keyup',function(e){
 var k=e.key;
 if(k=='ArrowLeft')hl=false;
 else if(k=='ArrowRight')hr=false;
 else if(k==' '||k=='ArrowUp')jup();
});
function bind(el,dn,up){
 el.addEventListener('touchstart',function(e){e.preventDefault();dn();},{passive:false});
 el.addEventListener('touchend',function(e){e.preventDefault();up();},{passive:false});
 el.addEventListener('touchcancel',function(e){e.preventDefault();up();},{passive:false});
 el.addEventListener('mousedown',function(e){e.preventDefault();dn();});
 addEventListener('mouseup',function(){up();});
}
bind(document.getElementById('bl'),function(){audioInit();hl=true;},function(){hl=false;});
bind(document.getElementById('br'),function(){audioInit();hr=true;},function(){hr=false;});
bind(document.getElementById('bj'),jdown,jup);
function cxy(e){
 var r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e;
 return{x:(t.clientX-r.left)/r.width*W,y:(t.clientY-r.top)/r.height*H};
}
function tap(e){
 var q=cxy(e);
 if(q.x>W-38&&q.y<30){mute=mute?0:1;audioInit();return;}
 confirm2();
}
cv.addEventListener('touchstart',function(e){e.preventDefault();tap(e);},{passive:false});
cv.addEventListener('mousedown',tap);

requestAnimationFrame(loop);
